name: Build and publish Khela Hobe APK

# HOW TO UPDATE (easy):
#   1. Upload  update.zip  to the main (root) folder of this repository.
#   2. Wait 3-6 minutes. This workflow unzips it, applies the files, builds the APK
#      and publishes it on the Releases page.
#   3. Open the Releases page on your phone and install KhelaHobe.apk (it updates the old app).
#
# Inside update.zip the folders must match the repository, for example:
#   index.html                                   -> the dashboard (most common update)
#   android/app/src/main/java/.../MainActivity.java   -> a change to the Android app itself
# (Workflow files, Code.gs and signing keys inside the zip are ignored for safety.)
on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write        # lets the workflow save the update and publish the APK

concurrency:
  group: khela-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Unzip and apply update.zip (if you uploaded one)
        id: apply
        run: |
          if [ -f update.zip ]; then
            rm -rf /tmp/upd && mkdir -p /tmp/upd
            unzip -o -q update.zip -d /tmp/upd
            rm -rf /tmp/upd/__MACOSX
            find /tmp/upd -name '.DS_Store' -delete
            src=/tmp/upd
            only=$(ls -A "$src")
            if [ "$(ls -A "$src" | wc -l)" = "1" ] && [ -d "$src/$only" ]; then src="$src/$only"; fi
            echo "Files in update.zip:"; (cd "$src" && find . -type f | sort)
            (cd "$src" && tar cf - --exclude='.github' --exclude='.git' --exclude='Code.gs' --exclude='*.keystore' .) | tar xf - -C .
            rm -f update.zip
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "No update.zip - building the current files"
          fi

      - name: Save the update in the repository and remove update.zip
        if: steps.apply.outputs.applied == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply update.zip (build ${{ github.run_number }})" || echo "Nothing to commit"
          git push

      - name: Use the newest dashboard (index.html in the root folder)
        run: |
          if [ -f index.html ]; then
            cp index.html android/app/src/main/assets/index.html
            sed -i '/<link rel="manifest"/d; /serviceWorker/d' android/app/src/main/assets/index.html
            echo "Using index.html from the root folder"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the signed APK
        working-directory: android
        run: gradle assembleRelease --no-daemon -Pvc=${{ github.run_number }}

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk KhelaHobe.apk

      - name: Keep a copy in the run (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: KhelaHobe-apk
          path: KhelaHobe.apk

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Khela Hobe - update ${{ github.run_number }}
          body: "Open this page on your phone, tap KhelaHobe.apk and install. It updates the app you already have."
          files: KhelaHobe.apk
          make_latest: true
