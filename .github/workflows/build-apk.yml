name: Build and publish Khela Hobe APK

# Runs automatically every time you upload / change files in this repository.
# You can also start it by hand: Actions tab -> "Build and publish Khela Hobe APK" -> Run workflow.
on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write        # lets the workflow publish the APK on the Releases page

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      # EASY UPDATE: upload a new index.html to the main (root) folder of the repo and it is used automatically.
      - name: Use the newest dashboard (index.html in the root folder, if you uploaded one)
        run: |
          if [ -f index.html ]; then
            cp index.html android/app/src/main/assets/index.html
            sed -i '/<link rel="manifest"/d; /serviceWorker/d' android/app/src/main/assets/index.html
            echo "Using index.html from the root folder"
          else
            echo "No root index.html - using the one inside the android folder"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the signed APK
        working-directory: android
        run: gradle assembleRelease --no-daemon -Pvc=${{ github.run_number }}

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk KhelaHobe.apk

      - name: Keep a copy in the run (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: KhelaHobe-apk
          path: KhelaHobe.apk

      - name: Publish on the Releases page (easy download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Khela Hobe - update ${{ github.run_number }}
          body: "Open this page on your phone, tap KhelaHobe.apk and install. It updates the app you already have."
          files: KhelaHobe.apk
          make_latest: true
