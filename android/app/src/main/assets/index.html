<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15151e">
<title>Khela Hobe - Samuda Spec Chem Ltd.</title>
<style>
:root{--bg:#15151e;--card:#1e1e2a;--tx:#fff;--mu:#9a9aae;--bar:#33334a;--t:#e10600;--a:#ff8000}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#15151e;min-height:100vh;color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 12px 24px}
header{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:14px 2px 8px}
h1{font-size:19px;margin:0}
.sub{color:var(--mu);font-size:12px}
button,select{font:inherit;border:1px solid var(--bar);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 10px}
.bar{display:flex;gap:8px;margin-bottom:12px}
.bar select{flex:1}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:18px 2px 8px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.card{background:var(--card);border-radius:14px;padding:12px 14px}
.card h3{margin:0 0 8px;font-size:15px}
.th h3{color:var(--t)}.ad h3{color:var(--a)}
.row{margin:9px 0}
.top{display:flex;justify-content:space-between;gap:8px}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk{display:inline-block;width:20px;color:var(--mu)}
.v{font-weight:600;white-space:nowrap}
.tr{height:6px;border-radius:4px;background:var(--bar);margin-top:4px}
.fl{height:100%;border-radius:4px}
.th .fl{background:var(--t)}.ad .fl{background:var(--a)}
.msg{padding:16px;text-align:center;color:var(--mu)}
.err{color:#dc2626}
#login{max-width:340px;margin:12vh auto 0;background:var(--card);border-radius:16px;padding:22px}
#login h1{text-align:center;margin-bottom:4px}
#login .sub{text-align:center;margin-bottom:14px}
#login input[type=text],#login input[type=password]{width:100%;font:inherit;padding:11px;margin:5px 0;border:1px solid var(--bar);border-radius:8px;background:var(--bg);color:var(--tx)}
#login .go{width:100%;margin-top:10px;background:var(--t);color:#fff;border:0;padding:11px;font-weight:600}
#login label{font-size:13px;color:var(--mu);display:block;margin-top:6px}
#lerr{color:#dc2626;font-size:13px;min-height:18px;margin-top:6px;text-align:center}
.hb{display:flex;gap:6px}
.grp{border-top:1px solid var(--bar);padding-top:6px;margin-top:8px}
.grp:first-of-type{border-top:0;margin-top:0}
.gn{font-weight:700;font-size:13px;margin-top:2px}
.rk2{display:inline-block;width:32px;color:var(--mu);font-size:12px}
#uppanel input[type=file]{width:100%;margin:10px 0;font:inherit}
.opt{display:block;margin:6px 0;font-size:14px}
#upgo{flex:1;background:var(--t);color:#fff;border:0;font-weight:600}
#upgo:disabled{opacity:.45}
.f1{font-family:"Arial Narrow","Roboto Condensed",system-ui,sans-serif;font-style:italic}
.co{text-align:center;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#b9b9cc}
#login .co{margin-bottom:6px}
.brand{font-weight:800;letter-spacing:.12em;font-size:14px;border-left:4px solid #e10600;padding-left:8px;font-style:italic}
.lb-title{text-align:center;font-size:30px;font-weight:900;letter-spacing:.05em;margin:8px 0 2px;font-style:italic;text-transform:uppercase}
.chk{height:10px;margin:8px 0 12px;border-radius:2px;background:repeating-conic-gradient(#fff 0 25%,#15151e 0 50%) 0 0/10px 10px;opacity:.9}
.tabs{display:flex;justify-content:center;gap:6px;margin-bottom:8px}
.tabs button{background:#1e1e2a;border:0;color:#cfcfe0;font-weight:800;font-style:italic;letter-spacing:.08em;padding:8px 20px;border-radius:4px;border-bottom:3px solid transparent}
.tabs button.on{color:#fff;border-bottom-color:#e10600;background:#2a2a3a}
.lv{display:flex;justify-content:center;align-items:center;gap:6px;font-size:11px;letter-spacing:.1em;color:#9a9aae;margin-bottom:14px;text-transform:uppercase}
.lv i{width:8px;height:8px;border-radius:50%;background:#e10600;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.tw{background:#111119;border-radius:8px;padding:10px 10px 12px;border-top:3px solid #e10600;box-shadow:0 4px 16px rgba(0,0,0,.45)}
.tw .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:900;font-style:italic;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.cat{padding:2px 8px;border-radius:3px;color:#111;font-size:12px}
.t .cat{background:#27f4d2}.a .cat{background:#ff8000}
.rw{display:flex;align-items:stretch;height:38px;margin-top:3px;border-radius:4px;overflow:hidden;background:linear-gradient(90deg,#2b2b3b,#1a1a25);font-style:italic}
.pos{flex:none;width:38px;display:flex;align-items:center;justify-content:center;background:#f2f2f6;color:#15151e;font-weight:900;font-size:17px}
.pos.p1{background:#ffd23f}.pos.p2{background:#d5d9e0}.pos.p3{background:#d9893f}
.stripe{flex:none;width:5px}
.rw .nm{flex:1;min-width:0;display:flex;align-items:center;padding:0 10px;font-weight:800;font-size:14px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{align-self:center;flex:none;margin-right:8px;padding:2px 7px;border-radius:3px;background:#0d0d14;border:1px solid #3a3a52;font-size:11px;font-weight:800;letter-spacing:.04em;color:#cfcfe0}
.chg{flex:none;width:52px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;background:#0d0d14}
.chg.up{color:#00e676}.chg.dn{color:#ff4545}.chg.nc{color:#6b6b82}.chg.nw{color:#c77dff;font-size:11px}
.rw.fu{animation:fu 2.2s ease-out}.rw.fd{animation:fd 2.2s ease-out}
@keyframes fu{from{box-shadow:inset 0 0 0 40px rgba(0,230,118,.45)}to{box-shadow:inset 0 0 0 40px rgba(0,230,118,0)}}
@keyframes fd{from{box-shadow:inset 0 0 0 40px rgba(255,69,69,.45)}to{box-shadow:inset 0 0 0 40px rgba(255,69,69,0)}}
.gh{margin:12px 0 2px;padding-left:8px;border-left:3px solid #e10600;font-weight:900;font-style:italic;font-size:12px;letter-spacing:.08em;color:#cfcfe0;text-transform:uppercase}
.hb button{white-space:nowrap;padding:7px 9px;font-size:13px}
.cmp{text-align:center;font-size:11px;color:#cfcfe0;margin:-8px 0 14px;letter-spacing:.05em;text-transform:uppercase}
.cmp b{color:#fff}
#pwpanel input[type=password]{width:100%;font:inherit;padding:11px;margin:5px 0;border:1px solid var(--bar);border-radius:8px;background:var(--bg);color:var(--tx)}
#pwgo{flex:1;background:var(--t);color:#fff;border:0;font-weight:600}
#pwgo:disabled{opacity:.45}
.brand .sub{white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.04em}
.prize{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 8px;padding:7px 10px;border-radius:4px;background:linear-gradient(90deg,#ffd23f,#ff9f1c);color:#15151e;font-weight:900;font-style:italic;letter-spacing:.08em;font-size:13px;text-transform:uppercase}
.prize.gift{background:linear-gradient(90deg,#27f4d2,#3b9cff)}
#run{position:fixed;top:0;left:0;right:0;bottom:0;z-index:999;background:#15151e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-style:italic}
#run[hidden]{display:none}
#run .stage{position:relative;width:100%;height:120px;overflow:hidden}
#run .rabbit{position:absolute;bottom:16px;left:0;animation:runx 2.3s linear infinite}
@keyframes runx{from{transform:translateX(-140px)}to{transform:translateX(100vw)}}
#run .hop{animation:hop .3s ease-in-out infinite alternate}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-16px)}}
#run .ground{position:absolute;left:0;right:0;bottom:10px;height:3px;background:repeating-linear-gradient(90deg,#e10600 0 18px,transparent 18px 30px);animation:gr .45s linear infinite}
@keyframes gr{to{background-position:-30px 0}}
#run .lgA,#run .lgB{transform-box:fill-box;transform-origin:50% 0;animation:leg .3s ease-in-out infinite alternate}
#run .lgB{animation-direction:alternate-reverse}
@keyframes leg{from{transform:rotate(-38deg)}to{transform:rotate(38deg)}}
#run .rt{font-weight:900;letter-spacing:.22em;font-size:18px}
#run .rs{color:#9a9aae;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
<body>
<div id="run" hidden>
  <div class="stage">
    <div class="rabbit"><div class="hop">
      <svg viewBox="0 0 120 80" width="112" height="75" aria-hidden="true">
        <g class="lgB"><ellipse cx="38" cy="62" rx="6.5" ry="14" fill="#d9deea"/></g>
        <g class="lgA"><ellipse cx="76" cy="62" rx="5.5" ry="13" fill="#d9deea"/></g>
        <circle cx="24" cy="42" r="8" fill="#fff"/>
        <ellipse cx="55" cy="46" rx="31" ry="17" fill="#fff"/>
        <ellipse cx="86" cy="14" rx="4.5" ry="13" fill="#fff" transform="rotate(-12 86 14)"/>
        <ellipse cx="86" cy="15" rx="2" ry="9" fill="#ffb3c7" transform="rotate(-12 86 14)"/>
        <ellipse cx="96" cy="15" rx="4.5" ry="12" fill="#fff" transform="rotate(10 96 15)"/>

        <circle cx="91" cy="36" r="13" fill="#fff"/>

      </svg>

<div id="main" hidden><header>
  <div class="brand">KHELA HOBE<div class="sub" id="upd">Loading…</div></div>
  <div class="hb"><button id="upb" hidden>⬆ Upload</button><button id="pwb" title="Change password">🔑</button><button id="ref">↻</button><button id="out">Logout</button></div>
</header>
<div id="dash" class="f1"><div class="lb-title">LEADER BOARD</div>

  <div class="card" style="margin-top:6px">

    <div class="sub" id="uphelp"></div>

  <h1>Khela Hobe</h1><div class="co">Samuda Spec Chem Ltd.</div><div class="sub">Sign in to continue</div>

    <input type="text" id="lu" placeholder="Username" autocomplete="username" autocapitalize="none" required>

<script>
/* ========= CONFIG: edit these ========= */
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbwtwstyUkvPzIy0NWiSzYqYZ1Nqcfi7m8IwDKQOpFCnYPLRMcrcplDf_nwX2G1-Axdi/exec",   // ends with /exec
  // Column header names in your sheet (case-insensitive):
  COL: { date:"Date", distributor:"Distributor", officer:"Sales Officer", category:"Category", value:"Sales Value", zone:"Zone", area:"Area", empId:"Employee ID", distCode:"Distributor Code" },
  CURRENCY: "৳",
  PRIZE_DIST: "Thailand",   // shown on the Top 10 Distributor cards
  GIFT_SO: "Sri Lanka"      // shown on the Top 10 Sales Officer cards
};
/* ====================================== */

const $ = id => document.getElementById(id);
let rows = [], has = {zone:true, area:true}, per = "all";

function parseCSV(t){
  const out=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){ if(ch=='"'){ if(t[i+1]=='"'){c+='"';i++} else q=false } else c+=ch }
    else if(ch=='"') q=true;
    else if(ch==','){r.push(c);c=""}
    else if(ch=='\n'){r.push(c);out.push(r);r=[];c=""}
    else if(ch!='\r') c+=ch;
  }
  if(c||r.length){r.push(c);out.push(r)}
  return out;
}
const num = s => {                       // "Tk 1,200.50" -> 1200.5 ; "(500)" or "-500" -> -500
  s=String(s==null?"":s).trim(); if(!s) return 0;
  const neg=/^\(.*\)$/.test(s)||/^[^\d(.\-]*-/.test(s);
  const v=parseFloat(s.replace(/[^0-9.]/g,""));
  return isNaN(v)?0:(neg?-v:v);
};
const norm = s => String(s==null?"":s).trim().toUpperCase();   // codes: "d01 " and "D01" are the same
const r2 = v => Math.round(v*100)/100;                           // avoid floating-point drift
const fmt = n => CONFIG.CURRENCY + Math.round(n).toLocaleString("en-IN");
const esc = s => String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

function parseDate(s){
  s=String(s||"").trim(); if(!s) return null;
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);   // dd/mm/yyyy
  if(m){let y=+m[3]; if(y<100)y+=2000; return new Date(y,+m[2]-1,+m[1])}
  m=s.match(/^Date\((\d+),(\d+),(\d+)\)$/);                      // gviz style
  if(m) return new Date(+m[1],+m[2],+m[3]);
  const d=new Date(s); return isNaN(d)?null:d;
}

/* turns the sheet rows into ranked data; shared by login, cached start-up and refresh */
function ingest(j){
    const data=[j.header,...j.rows];
    const head=data[0].map(h=>h.trim().toLowerCase());
    const idx={}; for(const k in CONFIG.COL){ idx[k]=head.indexOf(CONFIG.COL[k].toLowerCase()); if(idx[k]<0 && k!=="zone" && k!=="area" && k!=="empId" && k!=="distCode") throw new Error(`Column "${CONFIG.COL[k]}" not found. Found: ${data[0].join(", ")}`) }
    rows=data.slice(1).filter(r=>r.length>1).map(r=>{
      const cat=(r[idx.category]||"").toLowerCase();
      const d=parseDate(r[idx.date]);
      has.zone=idx.zone>=0; has.area=idx.area>=0;
      return {
        dist:(r[idx.distributor]||"").trim(), zone:idx.zone>=0?(r[idx.zone]||"").trim():"", area:idx.area>=0?(r[idx.area]||"").trim():"", so:(r[idx.officer]||"").trim(), soId:idx.empId>=0?norm(r[idx.empId]):"", dCode:idx.distCode>=0?norm(r[idx.distCode]):"",
        cat: cat.includes("thinner")?"Thinner":cat.includes("adhesive")?"Adhesive":null,
        val:num(r[idx.value]), ts:d?new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime():0, month:d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`:"" };
    }).filter(r=>r.cat&&r.val);
    // Employee ID = unique key for each Sales Officer; shown as "Name (ID)"
    const nm={}; rows.forEach(r=>{ if(r.soId&&r.so&&!nm[r.soId]) nm[r.soId]=r.so });
    rows.forEach(r=>{ if(r.soId) r.so=(nm[r.soId]||r.soId)+" ("+r.soId+")" });
    // Distributor Code = unique key for each distributor; shown as "Name (CODE)"
    const dn={}; rows.forEach(r=>{ if(r.dCode&&r.dist&&!dn[r.dCode]) dn[r.dCode]=r.dist });
    rows.forEach(r=>{ if(r.dCode) r.dist=(dn[r.dCode]||r.dCode)+" ("+r.dCode+")" });
}
function saveCache(j){            // lets the app open instantly next time (only when "keep me signed in")
  try{ if(localStorage.getItem("tk")) localStorage.setItem("rk:data",JSON.stringify({header:j.header,rows:j.rows,role:j.role})) }catch(e){}
}
function showNow(d,flip){
  ingest(d); showMain(); $("upb").hidden=d.role!=="admin"; saveCache(d); render(!!flip);
  $("upd").textContent="Updated "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
}
let busy=false, chg=false;
function run(on){ $("run").hidden=!on }
async function load(silent,anim){
  if(busy){                                   // a refresh is already running: keep the rabbit until it finishes
    if(anim){ run(true); const w=setInterval(()=>{ if(!busy){ clearInterval(w); run(false) } },200) }
    return;
  }
  busy=true; const t0=Date.now(); if(anim) run(true);
  if(!silent) $("app").innerHTML='<div class="msg">Loading data…</div>';
  try{
    if(!CONFIG.API_URL||CONFIG.API_URL.startsWith("PASTE")) throw new Error("Set API_URL in index.html CONFIG.");
    const j=await api({action:"data",token:getToken()});
    if(!j.ok){ if(j.error==="SESSION"){ clearToken(); showLogin("Session expired. Please sign in again."); return } throw new Error(j.error) }
    ingest(j); showMain(); $("upb").hidden=j.role!=="admin"; saveCache(j);
    if(anim){ const w=500-(Date.now()-t0); if(w>0) await new Promise(r=>setTimeout(r,w)); run(false) }   // rabbit shows at least half a second
    render(!!silent);
    $("upd").textContent="Updated "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  }catch(e){
    if(silent){ $("upd").textContent="Offline - retrying" }
    else{ $("app").innerHTML=`<div class="msg err">${esc(e.message)}</div>`; $("upd").textContent="Error" }
  }finally{ busy=false; if(anim) run(false) }
}

function inPer(r){            // TODAY / WEEK (last 7 days incl. today) / MONTH (this calendar month)
  if(per==="all") return true;     // no period menu: every row in the sheet counts
  if(!r.ts) return false;
  const n=new Date(), t0=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
  const diff=Math.round((t0-r.ts)/864e5);
  if(per==="today") return diff===0;
  if(per==="week") return diff>=0&&diff<=6;
  const d=new Date(r.ts); return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth();
}

function top10(cat,key,m){
  const map={};
  for(const r of rows){ if(r.cat!==cat||!inPer(r)||!r[key]) continue; map[r[key]]=(map[r[key]]||0)+r.val }
  return Object.entries(map).map(([k,v])=>[k,r2(v)]).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,10);
}
function byGroup(cat,key,gk,m){
  const g={};
  for(const r of rows){
    if(r.cat!==cat||!inPer(r)||!r[key]) continue;
    const k=r[gk]||"Unassigned";
    if(!g[k]) g[k]={};
    g[k][r[key]]=(g[k][r[key]]||0)+r.val;
  }
  return Object.keys(g).sort().map(k=>[k,Object.entries(g[k]).map(([n,v])=>[n,r2(v)]).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,2)]);
}
/* ---- F1 timing-tower ranking with previous -> current tracking ---- */
const TEAM=["#27f4d2","#e80020","#3671c6","#ff8000","#229971","#0093cc","#6692ff","#b6babd","#52e252","#ff87bc"];
const hue=k=>{let h=0;for(const c of k)h=(h*31+c.charCodeAt(0))>>>0;return TEAM[h%TEAM.length]};
// remembers the last ranking; when the order changes, the old one becomes "previous"
function track(id,keys){
  let st=null,changed=false;
  try{ st=JSON.parse(localStorage.getItem("rk:"+id)||"null") }catch(e){}
  const sig=keys.join("\u0001");
  if(!st){ st={cur:keys,prev:null} }
  else if(st.cur.join("\u0001")!==sig){ st={cur:keys,prev:st.cur.length?st.cur:null}; changed=true; chg=true }
  try{ localStorage.setItem("rk:"+id,JSON.stringify(st)) }catch(e){}
  return {prev:st.prev,changed};
}
function row(cid,key,i,t){
  const m=key.match(/^(.*) \(([^()]+)\)$/), nm=m?m[1]:key, id=m?m[2]:"";
  let ch='<span class="chg nc">–</span>', fl="";
  if(t.prev){
    const p=t.prev.indexOf(key);
    if(p<0) ch='<span class="chg nw">NEW</span>';
    else{ const d=p-i;
      if(d>0){ ch=`<span class="chg up">▲${d}</span>`; if(t.changed) fl=" fu" }
      else if(d<0){ ch=`<span class="chg dn">▼${-d}</span>`; if(t.changed) fl=" fd" } }
  }
  return `<div class="rw${fl}" data-k="${esc(cid+"|"+key)}"><span class="pos${i<3?" p"+(i+1):""}">${i+1}</span><span class="stripe" style="background:${hue(key)}"></span><span class="nm">${esc(nm)}</span>${id?`<span class="tag">${esc(id)}</span>`:""}${ch}</div>`;
}
function fCard(cls,cat,sub,list,cid,bd){
  cid=per+":"+cid;
  const keys=list.map(e=>e[0]), t=track(cid,keys);
  const body=list.length?list.map((e,i)=>row(cid,e[0],i,t)).join(""):'<div class="msg">No data</div>';
  return `<div class="tw ${cls}"><div class="hd"><span class="cat">${cat}</span>${sub}</div>${bd||""}${body}</div>`;
}
function gCard(cls,cat,sub,groups,ok,colName,cid,lbl){
  let body;
  if(!ok) body=`<div class="msg err">Column "${colName}" not found in sheet</div>`;
  else if(!groups.length) body='<div class="msg">No data</div>';
  else body=groups.map(([gn,list])=>{
    const id=per+":"+cid+":"+gn, t=track(id,list.map(e=>e[0]));
    return `<div class="gh">${lbl} · ${esc(gn)}</div>`+list.map((e,i)=>row(id,e[0],i,t)).join("");
  }).join("");
  return `<div class="tw ${cls}"><div class="hd"><span class="cat">${cat}</span>${sub}</div>${body}</div>`;
}
const prizeBox=()=>`<div class="prize">🏆 PRIZE · ${esc(CONFIG.PRIZE_DIST)} 🇹🇭</div>`;
const giftBox=()=>`<div class="prize gift">🎁 GIFT · ${esc(CONFIG.GIFT_SO)} 🇱🇰</div>`;
function render(flip){
  const m=per, old={}; chg=false;
  if(flip) document.querySelectorAll("[data-k]").forEach(e=>{ old[e.dataset.k]=e.getBoundingClientRect().top });
  $("app").innerHTML=`<div class="grid">`+
   fCard("t","THINNER","TOP 10 DISTRIBUTORS",top10("Thinner","dist",m),"td",prizeBox())+
   fCard("a","ADHESIVE","TOP 10 DISTRIBUTORS",top10("Adhesive","dist",m),"ad",prizeBox())+
   fCard("t","THINNER","TOP 10 SALES OFFICERS",top10("Thinner","so",m),"ts",giftBox())+
   fCard("a","ADHESIVE","TOP 10 SALES OFFICERS",top10("Adhesive","so",m),"as",giftBox())+
   gCard("t","THINNER","DISTRIBUTORS BY ZONE",byGroup("Thinner","dist","zone",m),has.zone,"Zone","tdz","ZONE")+
   gCard("t","THINNER","SALES OFFICERS BY ZONE",byGroup("Thinner","so","zone",m),has.zone,"Zone","tsz","ZONE")+
   gCard("a","ADHESIVE","DISTRIBUTORS BY AREA",byGroup("Adhesive","dist","area",m),has.area,"Area","ada","AREA")+
   gCard("a","ADHESIVE","SALES OFFICERS BY AREA",byGroup("Adhesive","so","area",m),has.area,"Area","asa","AREA")+
   `</div>`;
  // "previous update -> current update" line
  let meta=null; try{ meta=JSON.parse(localStorage.getItem("rk:meta")||"null") }catch(e){}
  if(!meta) meta={cur:Date.now(),prev:null};
  else if(chg) meta={cur:Date.now(),prev:meta.cur};
  try{ localStorage.setItem("rk:meta",JSON.stringify(meta)) }catch(e){}
  const fm=t=>new Date(t).toLocaleString([], {day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
  $("cmp").innerHTML=meta.prev?`Previous update <b>${fm(meta.prev)}</b> → Current update <b>${fm(meta.cur)}</b>`:`Current update <b>${fm(meta.cur)}</b>`;
  if(flip) document.querySelectorAll("[data-k]").forEach(e=>{      // rows glide to their new position
    const o=old[e.dataset.k]; if(o==null||!e.animate) return;
    const dy=o-e.getBoundingClientRect().top;
    if(Math.abs(dy)>2) e.animate([{transform:"translateY("+dy+"px)"},{transform:"none"}],{duration:700,easing:"cubic-bezier(.2,.8,.2,1)"});
  });
}
$("ref").onclick=()=>{ $("upd").textContent="Refreshing…"; load(true,true) };
/* ---- auth ---- */
async function api(body){
  const r=await fetch(CONFIG.API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  return r.json();
}
const getToken=()=>sessionStorage.getItem("tk")||localStorage.getItem("tk")||"";
const clearToken=()=>{sessionStorage.removeItem("tk");localStorage.removeItem("tk");try{localStorage.removeItem("rk:data")}catch(e){}};
function showLogin(msg){ $("main").hidden=true; $("login").hidden=false; $("lerr").textContent=msg||""; $("lp").value="" }
function showMain(){ $("login").hidden=true; $("main").hidden=false; $("uppanel").hidden=true; $("pwpanel").hidden=true; $("dash").hidden=false }
$("lf").onsubmit=async e=>{
  e.preventDefault(); const b=$("lb"); b.disabled=true; b.textContent="Signing in…"; $("lerr").textContent="";
  try{
    if(!CONFIG.API_URL||CONFIG.API_URL.startsWith("PASTE")) throw new Error("Set API_URL in index.html CONFIG.");
    const j=await api({action:"login",username:$("lu").value,password:$("lp").value});
    if(!j.ok) throw new Error(j.error);
    (  $("lr").checked?localStorage:sessionStorage ).setItem("tk",j.token);
    $("lp").value="";
    if(j.sales) showNow({header:j.sales.header,rows:j.sales.rows,role:j.role},false);   // fast path: data came with login
    else load(false,true);                                                                // older backend: fetch separately
  }catch(err){ $("lerr").textContent=err.message }
  b.disabled=false; b.textContent="Sign in";
};
$("out").onclick=async()=>{ const t=getToken(); clearToken(); rows=[]; showLogin(); try{await api({action:"logout",token:t})}catch(_){} };
/* ---- upload (admin) ---- */
let up={header:null,rows:[]};
$("uphelp").textContent="First row must have these headings: "+Object.values(CONFIG.COL).join(", ")+" (Zone and Area are optional). Employee ID must be unique for each Sales Officer. File: .csv or .xlsx";
$("upb").onclick=()=>{ $("pwpanel").hidden=true; $("dash").hidden=true; $("uppanel").hidden=false; $("upmsg").textContent="" };
$("upback").onclick=()=>{ $("uppanel").hidden=true; $("dash").hidden=false };
function loadXLSX(){
  return window.XLSX?Promise.resolve():new Promise((ok,no)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload=ok; s.onerror=()=>no(new Error("Could not load the Excel reader. Save the file as CSV and try again."));
    document.head.appendChild(s);
  });
}
$("upfile").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  $("upmsg").textContent="Reading file…"; $("upgo").disabled=true;
  try{
    let data;
    if(/\.csv$/i.test(f.name)) data=parseCSV((await f.text()).replace(/^\uFEFF/,""));
    else{
      await loadXLSX();
      const wb=XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:true});
      data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,dateNF:"dd/mm/yyyy",defval:""});
    }
    data=data.filter(r=>r.some(c=>String(c).trim()!==""));
    if(data.length<2) throw new Error("The file has no data rows.");
    const header=data[0].map(h=>String(h).trim());
    const low=header.map(h=>h.toLowerCase());
    const need=["date","distributor","distCode","officer","empId","category","value"].map(k=>CONFIG.COL[k]);
    const miss=need.filter(n=>!low.includes(n.toLowerCase()));
    if(miss.length) throw new Error("Missing column(s): "+miss.join(", ")+". Found: "+header.join(", "));
    const vi=low.indexOf(CONFIG.COL.value.toLowerCase()), ci=low.indexOf(CONFIG.COL.category.toLowerCase());
    const ei=low.indexOf(CONFIG.COL.empId.toLowerCase()), di=low.indexOf(CONFIG.COL.distCode.toLowerCase());
    const dti=low.indexOf(CONFIG.COL.date.toLowerCase()), ni=low.indexOf(CONFIG.COL.officer.toLowerCase()), dni=low.indexOf(CONFIG.COL.distributor.toLowerCase());
    let bad=0, noEmp=0, noDist=0, zero=0, badDate=0, total=0;
    const dnames={}, enames={};
    const rows2=data.slice(1).map(r=>{
      r=header.map((_,i)=>String(r[i]==null?"":r[i]).trim());
      r[vi]=num(r[vi]); total+=r[vi];
      r[ei]=norm(r[ei]); r[di]=norm(r[di]);
      const c=r[ci].toLowerCase(); if(!c.includes("thinner")&&!c.includes("adhesive")) bad++;
      if(!r[ei]) noEmp++; else (enames[r[ei]]=enames[r[ei]]||new Set()).add(r[ni].toLowerCase());
      if(!r[di]) noDist++; else (dnames[r[di]]=dnames[r[di]]||new Set()).add(r[dni].toLowerCase());
      if(!r[vi]) zero++;
      if(!parseDate(r[dti])) badDate++;
      return r;
    });
    const multi=o=>Object.values(o).filter(x=>x.size>1).length;
    const w=[];
    if(bad) w.push(bad+" rows have a Category that is not Thinner/Adhesive (not ranked)");
    if(noDist) w.push(noDist+" rows have no Distributor Code");
    if(noEmp) w.push(noEmp+" rows have no Employee ID");
    if(zero) w.push(zero+" rows have a zero or unreadable Sales Value");
    if(badDate) w.push(badDate+" rows have a Date the app cannot read (use dd/mm/yyyy)");
    if(multi(dnames)) w.push(multi(dnames)+" Distributor Codes have more than one name (first name is shown)");
    if(multi(enames)) w.push(multi(enames)+" Employee IDs have more than one name (first name is shown)");
    up={header,rows:rows2};
    $("upmsg").innerHTML="✔ "+rows2.length+" rows ready. Total Sales Value: "+fmt(total)+"<br>Check this total against your file."+w.map(x=>"<br>⚠ "+esc(x)).join("");
    $("upgo").disabled=false;
  }catch(err){ up={header:null,rows:[]}; $("upmsg").innerHTML='<span class="err">'+esc(err.message)+'</span>' }
};
$("upgo").onclick=async()=>{
  const mode=document.querySelector('input[name=upmode]:checked').value;
  if(mode==="replace" && !confirm("This will DELETE all existing sales data and replace it with this file. Continue?")) return;
  const btn=$("upgo"); btn.disabled=true;
  try{
    const N=1500, total=up.rows.length, tk=getToken();
    for(let i=0;i<total;i+=N){
      $("upmsg").textContent="Uploading "+Math.min(i+N,total)+" / "+total+" …";
      const j=await api({action:"upload",token:tk,mode,first:i===0,header:up.header,rows:up.rows.slice(i,i+N),dateCol:CONFIG.COL.date});
      if(!j.ok){ if(j.error==="SESSION"){ clearToken(); showLogin("Session expired. Please sign in again."); return } throw new Error(j.error) }
    }
    up={header:null,rows:[]}; $("upfile").value="";
    await load();
    $("upd").textContent="Uploaded "+total+" rows ✔";
  }catch(err){ $("upmsg").innerHTML='<span class="err">'+esc(err.message)+'</span>'; btn.disabled=false }
};

/* ---- change password ---- */
$("pwb").onclick=()=>{ $("dash").hidden=true; $("uppanel").hidden=true; $("pwpanel").hidden=false; $("pwmsg").textContent="" };
$("pwback").onclick=()=>{ $("pwpanel").hidden=true; $("dash").hidden=false };
$("pwf").onsubmit=async e=>{
  e.preventDefault();
  const o=$("pw0").value, n=$("pw1").value, c=$("pw2").value, m=$("pwmsg"), b=$("pwgo");
  if(n.length<6){ m.innerHTML='<span class="err">New password must be at least 6 characters.</span>'; return }
  if(n!==c){ m.innerHTML='<span class="err">New passwords do not match.</span>'; return }
  b.disabled=true; m.textContent="Saving…";
  try{
    const j=await api({action:"changepw",token:getToken(),oldPassword:o,newPassword:n});
    if(!j.ok){ if(j.error==="SESSION"){ clearToken(); showLogin("Session expired. Please sign in again."); return } throw new Error(j.error) }
    $("pw0").value=""; $("pw1").value=""; $("pw2").value="";
    m.textContent="✔ Password changed. Use the new password next time you sign in.";
  }catch(err){ m.innerHTML='<span class="err">'+esc(err.message)+'</span>' }
  b.disabled=false;
};

/* ---- auto update ---- */
setInterval(()=>{ if(!document.hidden && !$("main").hidden && getToken() && !$("dash").hidden) load(true) },60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && !$("main").hidden && getToken() && !$("dash").hidden) load(true) });

(function boot(){
  if(!getToken()){ showLogin(); return }
  let c=null; try{ c=JSON.parse(localStorage.getItem("rk:data")||"null") }catch(e){}
  if(c&&c.rows){ try{ showNow(c,false); $("upd").textContent="Updating…"; load(true); return }catch(e){} }
  load(false,true);
})();
</script>
